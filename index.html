    v.innerHTML=promoHtml()+'<div class="cards">'+Object.entries(CROPS).map(([id,c])=>{const ok=canBuy(id),mx=have(id)>=15;return `<div class="card${ok?'':' lockrow'}"><span class="ic">${c.icon}</span><b>${c.name}</b><p>${DESC[id]}</p><small>${ok?'Растёт '+fmt(c.time)+' · запас '+have(id)+'/15':'Доступно: '+snames(id)}</small><button class="btn" data-buy="${id}" ${(S.coins<c.seed||!ok||mx)?'disabled':''}>${!ok?'🔒':mx?'Максимум':c.seed+' 🪙'}</button></div>`}).join('')+'</div><div class="sec">Кристаллы</div><div class="packs">'+SHOP_PACKS.map(k=>`<button class="pk" data-pay="${k.id}"><span class="pk-i">💎</span><b>${k.n}</b><small>${k.st} ⭐</small></button>`).join('')+'</div>'+`<div class="pcard" style="margin-top:14px"><span class="pbadge">1 РАЗ</span><div class="pic2">💎</div><div class="ptit">1 кристалл за 1 ⭐</div><button class="btn pbtn" type="button" data-pay="gem1" ${S.gem1?'disabled':''}>${S.gem1?'Куплено ✓':'1 ⭐'}</button></div>`;
  }else if(btab==='mkt'){
    h.textContent='Рынок';
    const nw=newsList(nowK()).slice(0,4);
    let html=TABS()+`<div class="seeds">${[[36,'6 ч'],[144,'1 д'],[432,'3 д']].map(([n,l])=>`<button class="chip${mper===n?' on':''}" data-mper="${n}">${l}</button>`).join('')}</div>`;
    html+=nw.length?nw.map(e=>`<div class="row news"><span class="ic">${e.i}</span><div class="t">${e.txt}<small>${e.st}</small></div></div>`).join(''):'<div class="empty-msg" style="padding:12px">На рынке спокойно</div>';
    html+=CI.map(id=>{const a=series(id,mper);return `<button class="row mk${selM===id?' on':''}" data-mk="${id}"><span class="ic">${CROPS[id].icon}</span><span class="t">${CROPS[id].name}<small>${price(id).toFixed(1)} 🪙 · ${chg(id,mper)}</small></span><span class="${a[a.length-1]>=a[0]?'up':'dn'}">${spark(a)}</span></button>`+(selM===id?`<div class="sellbar chart">${chart(a)}</div>`:'')}).join('');
    v.innerHTML=html;
    return;
  }else if(btab==='ach'){
    h.textContent='Достижения';
    v.innerHTML=TABS()+Object.entries(AT).map(([k,a])=>{const L=alv(k),nx=a.lv[L],val=a.get();return `<button class="row ach2${L?'':' lock'}" data-ach="${k}"><span class="ic">${a.icon}</span><span class="t">${L?'':'🔒 '}${a.name}${L?' '+R[L]:''}<small>${nx?R[L+1]+': '+a.verb+' '+nx+' '+a.unit+' · '+val+'/'+nx:'Максимальный уровень · '+val}</small><span class="bar2" style="display:block;margin:6px 0 0"><i style="width:${nx?Math.min(100,val/nx*100):100}%"></i></span></span><span class="pips">${[0,1,2].map(i=>i<L?'●':'○').join('')}</span></button>`}).join('');
    return;
  }else{
    h.textContent='Продавай урожай за монеты';
    const ids=Object.keys(S.crops).filter(id=>S.crops[id]>0);
    if(!ids.length){v.innerHTML=TABS()+'<div class="empty-msg">Пока пусто. Собери урожай на грядках.</div>';return}
    const total=ids.reduce((a,id)=>a+S.crops[id]*CROPS[id].sell,0);
    v.innerHTML=TABS()+ids.map(id=>`<button class="row crow${selC===id?' on':''}" data-cpick="${id}"><span class="ic">${CROPS[id].icon}</span><span class="t">${CROPS[id].name}<small>${S.crops[id]} шт.</small></span></button>${selC===id?`<div class="sellbar"><button class="btn" style="width:100%" data-sell="${id}">Продать · +${S.crops[id]*CROPS[id].sell} 🪙</button></div>`:''}`).join('');
  }
}

document.querySelector('header').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){tab=b.dataset.go;render()}});
document.getElementById('view').addEventListener('scroll',e=>{const rail=e.target;if(rail&&rail.id==='promos'){const i=Math.round(rail.scrollLeft/Math.max(1,rail.clientWidth));rail.parentElement.querySelectorAll('[data-promodot]').forEach((d,j)=>d.classList.toggle('on',j===i))}},true);
document.getElementById('view').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.go){tab=d.go;render();return}
  else if(d.promodot!==undefined){const rail=document.getElementById('promos');if(rail){const i=+d.promodot;const card=rail.querySelectorAll('.pcard')[i];if(card)card.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});rail.querySelectorAll('.pcard').forEach((c,j)=>{const dot=document.querySelector('[data-promodot="'+j+'"]');if(dot)dot.classList.toggle('on',j===i)})}return}
  else if(d.tg){const u='https://t.me/FarmLand_news';if(TG&&TG.openTelegramLink)TG.openTelegramLink(u);else window.open(u,'_blank','noopener');return}
  else if(d.theme){S.theme=d.theme;applyTheme()}
  else if(d.reset){if(!window.rs){window.rs=1;b.textContent='Нажми ещё раз: всё сотрётся';return}b.disabled=true;b.textContent='Сбрасываем…';window.resetting=true;cloudEpoch++;cloudPending=null;(async()=>{try{await cloudWriteQueue;await clearCloud();try{localStorage.removeItem(KEY)}catch(x){}location.reload()}catch(err){window.resetting=false;b.disabled=false;b.textContent='Сбросить прогресс';window.rs=0;toast('Не удалось очистить облачное сохранение. Попробуй ещё раз внутри Telegram.');console.error(err)}})();return}
  else if(d.btab){btab=d.btab}
  else if(d.ach){const a=AT[d.ach],L=alv(d.ach),nx=a.lv[L];toast(nx?a.name+' '+R[L+1]+': '+a.verb+' '+nx+' '+a.unit+' ('+a.get()+'/'+nx+')':a.name+' III: достигнут максимальный уровень')}
  else if(d.scare){tab='skins'}
  else if(d.buyscare){if(S.coins<SC){toast('Нужно '+SC+' монет');return}S.coins-=SC;S.sc.w=100;S.sc.own=true;fly('🛡️ Пугало',e)}
  else if(d.start){const n=(document.getElementById('nn').value||'').trim();if(n.length<2){toast('Ник: минимум 2 символа');return}S.nick=n;S.reg=true;S.rd=Date.now();S.gift=false;tab='intro'}
  else if(d.nick){const n=(document.getElementById('nn').value||'').trim();if(n.length<2){toast('Ник: минимум 2 символа');return}if(S.coins<1475){toast('Нужно 1475 монет');return}S.coins-=1475;S.nick=n;toast('Ник изменён')}
  else if(d.gift){S.gift=true;S.coins+=150;S.qn=Date.now()+18e5;tab='menu';toast('Получено: 150 монет');fly('+150 🪙',e)}
  else if(d.ptab){ptab=d.ptab;pscroll=true}
  else if(d.phelp){phelp=!phelp}
  else if(d.tc){const t=claimTask(d.tc);if(t)fly(t,e)}
  else if(d.pc){const a=d.pc.split(':');window.justPc=d.pc;setTimeout(()=>{window.justPc=''},700);const t=claim(a[0],+a[1]);if(t)fly(t,e)}
  else if(d.buyprem){pay('premium');return}
  else if(d.pay){pay(d.pay);return}
  else if(d.gemoffer){const offer=ensureGemOffer();if(offer&&offer.activeUntil>Date.now()){pay('gems50');return}else{toast('Акция уже завершилась');render();return}}
  else if(d.pump){if(pumpOn()&&(S.cr||0)>=15){S.cr-=15;S.picons=S.picons||[];if(!S.picons.includes(3))S.picons.push(3);toast('Получена иконка 🎃');fly('🎃 Иконка',e)}else{toast('Не хватает кристаллов');return}}
  else if(d.zom){if(zomOn()){S.skins=S.skins||[];if(!S.skins.includes('halloween'))S.skins.push('halloween');toast('Получен скин «Зомби Пугало»');fly('🧟 Скин',e)}}
  else if(d.skin){S.sc.skin=d.skin==='classic'?'':d.skin}
  else if(d.inv){if(srvOn()){(async()=>{try{const j=await payPost('/ref/claim',{});if(j.ok){S.invd=true;earn(150);toast('Награда: 150 монет')}else if(j.already){S.invd=true;toast('Награда уже получена')}else{toast('Пока приглашено меньше 3 друзей');refSync(true);return}save();render()}catch(e){toast('Нет связи с сервером, попробуй позже')}})();return}if((S.inv||0)>=3){S.invd=true;earn(150);toast('Награда: 150 монет')}else{const u='https://t.me/share/url?url='+encodeURIComponent('https://t.me/FarmLand_news')+'&text='+encodeURIComponent('Заходи в Pocket FarmLand!');if(TG&&TG.openTelegramLink)TG.openTelegramLink(u);else window.open(u,'_blank','noopener');return}}
  else if(d.medal){toast(vetOk()?'Медаль ветерана: ты с нами больше года':(S.rd&&S.rd<Date.UTC(2027,0,1)?'Медаль ветерана: придёт через год после регистрации, '+new Date(S.rd+365*864e5).toLocaleDateString('ru-RU'):'Медаль ветерана выдаётся тем, кто зарегистрировался до 1 января 2027'))}
  else if(d.tplus){if(!TITLES.some(t=>t.ok())){toast('Титулов пока нет: получай достижения');return}tpick=!tpick}
  else if(d.title!==undefined){S.title=d.title;tpick=false}
  else if(d.mk){selM=selM===d.mk?'':d.mk}
  else if(d.mper){mper=+d.mper}
  else if(d.buygh){if(lvl()<GHL){toast('Нужен '+GHL+' уровень')}else if(S.coins<GHC){toast('Нужно '+GHC+' монет')}else{S.coins-=GHC;S.gh=true;S.plots.forEach(p=>{if(p.g)p.u=true});toast('Теплица открыта!')}}
  else if(d.qd!==undefined){const q=S.q[d.qd];if(!q||(S.crops[q.c]||0)<q.n){toast('Не хватает урожая');return}const l0=lvl();S.crops[q.c]-=q.n;earn(q.m);S.xp+=q.x;S.q.splice(d.qd,1);S.nq=(S.nq||0)+1;fly('+'+q.m+' 🪙',e);toast('Задание выполнено: +'+q.m+' 🪙, +'+q.x+' опыта');if(lvl()>l0)setTimeout(()=>toast('Новый уровень: '+lvl()+'!'),1500)}
  else if(d.cpick){selC=selC===d.cpick?'':d.cpick}
  else if(d.pickt){pick=!pick}
  else if(d.icon!==undefined){S.icon=+d.icon;pick=false}
  else if(d.seed){S.sel=S.sel===d.seed?'':d.seed}
  else if(d.plant!==undefined){
    if(!S.sel){toast(Object.keys(S.seeds).some(k=>S.seeds[k]>0)?'Сначала выбери семена внизу':'Нет семян, купи в магазине');return}
    if(have(S.sel)<1){toast('Нет семян, купи в магазине');return}
    if(!S.plots[d.plant].g&&!inSeason(S.sel)){toast('Не сезон: '+snames(S.sel));return}
    S.seeds[S.sel]--;S.np=(S.np||0)+1;const p=S.plots[d.plant];p.c=S.sel;p.t=Date.now()
  }else if(d.harvest!==undefined){
    const l0=lvl(),p=S.plots[d.harvest],c=CROPS[p.c],n=c.y[0]+Math.floor(Math.random()*(c.y[1]-c.y[0]+1)),x=c.xp;S.crops[p.c]=(S.crops[p.c]||0)+n;S.harv+=n;S.xp+=x;toast('Собрано: '+c.icon+' ×'+n+' · +'+x+' опыта');p.c=null;if(lvl()>l0)setTimeout(()=>toast('Новый уровень: '+lvl()+'!'),1200)
  }else if(d.wait!==undefined){return}
  else if(d.unlock!==undefined){
    const cost=unlockCost();if(S.coins<cost){toast('Не хватает монет: нужно '+cost);return}
    S.coins-=cost;S.plots[d.unlock].u=true
  }else if(d.buy){
    const c=CROPS[d.buy];if(S.coins<c.seed||!canBuy(d.buy)||have(d.buy)>=15)return;S.coins-=c.seed;S.seeds[d.buy]=have(d.buy)+1;fly('+1 '+c.icon,e)
  }else if(d.sell){
    const am=S.crops[d.sell]*CROPS[d.sell].sell;S.ns=(S.ns||0)+S.crops[d.sell];earn(am);S.crops[d.sell]=0;selC='';toast('Продано');fly('+'+am+' 🪙',e)
  }else if(d.sellall){
    Object.keys(S.crops).forEach(id=>{earn(S.crops[id]*CROPS[id].sell);S.crops[id]=0});toast('Всё продано')
  }
  checkAch();save();render();
});
